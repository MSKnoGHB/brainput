{% extends 'commandnote/base.html' %}
{% block content %}
  <h3>HeaderPartial</h3> 
  <div class="container">
    <div class="row">
      <div class="'col-12">

        <div class="row">
          <div class="'col-12 col-md-4">
            {% include '_sidebar.html' %}
          </div>

          <div class="'col-12 col-md-8">
            <h4>ErrorNote編集</h4>
            <div class="card bg-body-tertiary bg-opacity-50 p-3 mb-3">
              <form method="POST" action="{% url 'errornote:update' id=error_note.id %}">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-end">
                  <button type="submit" class="btn btn-sm btn-success">更新</button>
                  <a href="{% url 'errornote:destroy' id=error_note.id %}" class="btn btn-sm btn-danger">削除</a>
                </div>  
                <div class="d-flex gap-3 mb-3">
                  <div class="w-100">
                    <label class="form-label m-0">メインカテゴリ</label>
                    <select name="main_category" id="main-category-select" class="form-select w-100" required>
                      {% for main_category in main_categories %}
                        <option value="{{ main_category.id }}" {% if main_category.id == error_note.sub_category.main_category.id %}selected{% endif %}>
                          {{ main_category.name }}
                        </option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="w-100">
                    <label class="form-label m-0">サブカテゴリ</label>
                    <select name="sub_category" id="sub-category-select" class="form-select w-100" required>
                      {% for sub_category in sub_categories %}
                        <option value="{{ sub_category.id }}" {% if sub_category.id == error_note.sub_category.id %}selected{% endif %}>
                          {{ sub_category.name }}
                        </option>
                      {% endfor %}
                    </select>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label m-0">タイトル</label>
                  <input type="text" name="title" value="{{ error_note.title }}" placeholder="タイトルを入力" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label m-0">エラーメッセージ</label>
                  <textarea name="error_message" placeholder="コマンドを入力" class="form-control" rows="5" required>{{ error_note.error_message }} </textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label m-0">対象ファイル</label>
                  <textarea name="target_file" placeholder="コマンドの説明を入力" class="form-control" rows="5">{{ error_note.target_file }}</textarea>
                </div>
                <div class="mb-3">
                  <p class="item-label m-0">解決方法</p>
                  <textarea name="resolution" placeholder="その他情報を入力" class="form-control" rows="5">{{ error_note.resolution}}</textarea>
                </div>
                <div class="mb-3">
                  <p class="item-label m-0">参考ファイル</p>
                  <textarea name="reference" placeholder="その他情報を入力" class="form-control" rows="5">{{ error_note.reference}}</textarea>
                </div>
              </form>       
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
